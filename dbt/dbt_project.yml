name: revenue_pulse
version: "1.0.0"
config-version: 2

profile: revenue_pulse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # A row is late when it landed more than this many hours after the usage date
  # began. Normal pipeline latency is ~26h (early the next morning), so 48h
  # leaves clear headroom before anything is called late.
  late_after_hours: 48

  # Ledger reconciliation thresholds. A break must clear BOTH gates - see
  # DECISIONS.md section 2. booked_revenue is rounded to cents, so on a small
  # account-day a half-cent of rounding is up to 0.43% in relative terms.
  recon_rel_pct: 0.5
  recon_abs_usd: 0.01

  # --- robust z-score detector (dq_anomalies) ---
  # |z| above this is flagged. Chosen by sweeping 3 / 3.5 / 4 / 5 against the
  # label set - see eval/RESULTS.md. Nothing else here is tuned to the labels.
  anomaly_z_threshold: 4

  # MAD floor. A series that sits at the same value every weekday has MAD ~ 0,
  # which would make z explode on any movement at all. The floor is expressed
  # as a fraction of the expected value so it scales with account size, with a
  # tiny absolute term to cover an expected value of 0.
  mad_floor_pct_of_median: 0.05
  mad_floor_abs_usd: 0.01

  # Same-weekday observations required in the trailing window before a z-score
  # is trusted. 8 weeks of history gives at most 8.
  min_history_points: 4
  trailing_weeks: 8

  # --- detector v2 (dq_anomaly_scores_v2) ---
  # Only the two causes diagnosed for v1 are changed: growth bias in the
  # expectation, and an unstable spread estimated from 8 points. Nothing here
  # was fitted to ANOMALY_LABELS.
  #
  # Trend correction: ratio of the trailing 7-day median to the 7-day median
  # four weeks earlier. 7-day windows span a full weekday cycle, so the ratio
  # is weekday-neutral; both windows exclude the scored day so an anomaly
  # cannot inflate its own expectation.
  trend_window_days: 7
  trend_lag_days: 28
  # Guard against degenerate ratios on ramping or near-zero accounts. A 4-week
  # growth factor outside [0.5x, 2x] is treated as unmeasurable, not as trend.
  trend_max_log_shift: 0.6931

  # Spread: 13 weeks of residuals (all days, not one weekday), pooled with the
  # product x segment cohort as a lower bound.
  spread_weeks: 13
  spread_pool_weight: 0.5
  min_spread_points: 30
  # Floor as a relative move, converted to log units in the model.
  spread_floor_pct: 0.03

models:
  revenue_pulse:
    staging:
      +schema: STAGING
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table
    dq:
      +schema: DQ
      +materialized: table
